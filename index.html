<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="A personal library of React components. Preview each one, copy its code, or grab an AI-ready prompt."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <title>Reacteca</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      // Keep the key in sync with storageKeys.theme in src/lib/storage.ts.
      (function () {
        var dark = false;
        try {
          var stored = localStorage.getItem('reacteca:theme');
          var preference = stored ? JSON.parse(stored) : 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          dark = preference === 'dark' || (preference !== 'light' && prefersDark);
        } catch (e) {}
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
